[project]
name = "chrome-tests"
version = "0.1.0"
description = "High-level automated tests for Google Chrome, built on Test-Conductor"
requires-python = ">=3.11"
authors = [{ name = "David Akopyan" }]

dependencies = [
    "test-conductor[allure]",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "ty>=0.0.99,<0.1",
]

[tool.uv.sources]
test-conductor = { path = "../test-conductor", editable = true }


[tool.uv]
package = false


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

log_level = "DEBUG"
log_cli = false
log_format = "%(asctime)s %(levelname)-8s %(name)s %(message)s"
log_date_format = "%H:%M:%S"


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "ANN204"]
"conftest.py" = ["ANN001", "ANN201", "ANN202", "ANN204"]

[tool.ruff.format]
quote-style = "double"
