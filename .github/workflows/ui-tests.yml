name: ui-tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome-uia:
    name: real Chrome on a hosted runner
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the suite
        uses: actions/checkout@v7
        with:
          path: chrome-tests

      - name: Check out the framework beside it
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/test-conductor
          path: test-conductor

      - name: Install uv and python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the suite from its lockfile
        working-directory: chrome-tests
        run: uv sync --extra dev

      - name: Report which Chrome the framework found
        working-directory: chrome-tests
        run: uv run python -c "from chrome_config import find_chrome_executable; print(find_chrome_executable())"

      - name: Autotests against real Chrome
        working-directory: chrome-tests
        run: uv run pytest -v --save-log=always

      - name: Keep the artifacts of this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-test-output
          path: chrome-tests/test-output/
          if-no-files-found: warn

  report:
    name: publish the Allure report
    needs: chrome-uia
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Collect the results of the test run
        uses: actions/download-artifact@v8
        with:
          name: chrome-test-output
          path: test-output

      - name: Restore the published report's history
        run: |
          mkdir -p test-output/allure-results/history
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/history"
          for file in history.json history-trend.json retry-trend.json categories-trend.json duration-trend.json; do
            curl -sfL "$base/$file" -o "test-output/allure-results/history/$file" || true
          done
          ls -l test-output/allure-results/history

      - name: Install the Allure CLI
        run: npm install -g allure-commandline@2.46.1

      - name: Generate the report
        run: |
          java -version
          allure generate test-output/allure-results --clean -o allure-report

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload the report
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
